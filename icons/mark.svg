<!--
  Instrufilt mark — from the "Sibling logo concept" design project.

  An eighth note with a dot set above it. The dot is the only addition to the
  note, and it does the work of the "i" in instrufilt. Four pieces, in the order
  the Assemble animation builds them: stem, head, flag, dot.

  Brass gradient #ffd166 -> #f4743b on a warm near-black tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Instrufilt">
  <defs>
    <linearGradient id="ifGrad" gradientUnits="userSpaceOnUse" x1="52" y1="14" x2="196" y2="224">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4743b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#1c1712"/>
  <g transform="translate(128 128) scale(0.86) translate(-123.9 -119)">
    <path fill="url(#ifGrad)" fill-rule="nonzero" d="M141.21 176.30 A46 34 -16 1 1 52.79 201.70 A46 34 -16 1 1 141.21 176.30 Z M118 76 L136 76 L136 194 L118 194 Z M118 76 L152 76 C190 78 210 116 196 156 C192 172 184 181 176 187 C187 156 178 127 152 113 C147 110 141 108 130 107 Z M113 28 A14 14 0 1 1 141 28 A14 14 0 1 1 113 28 Z"/>
  </g>
</svg>
